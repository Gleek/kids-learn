<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create · Kids Learn</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="shared/puzzles.css">
  <link rel="stylesheet" href="shared/creative.css">
  <script src="shared/voice-clips.js" defer></script>
  <script src="shared/game.js" defer></script>
  <script src="shared/game-catalog.js" defer></script>
  <script src="shared/creative.js" defer></script>
</head>
<body class="puzzle-page">
  <main id="game-wrapper">
    <header class="game-topbar">
      <a href="index.html?category=Create#picture-puzzles" class="game-back">← Games</a>
      <h1 id="creative-title">Create</h1>
    </header>
    <section class="puzzle-stage creative-stage" id="creative-stage">
      <div class="puzzle-prompt">
        <p id="creative-prompt" class="creative-prompt"></p>
        <button id="creative-listen" class="listen-btn" type="button" aria-label="Read the prompt aloud">🔊</button>
      </div>
      <div class="creative-tools" id="game-tools"></div>
      <div class="creative-board" id="creative-board"></div>
      <div class="creative-tools" id="action-tools"></div>
      <p id="creative-status" class="creative-status" role="status"></p>
    </section>
  </main>
</body>
</html>
