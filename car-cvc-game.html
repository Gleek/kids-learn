<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVC Word Car Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f4ff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    padding: 10px 0;
  }

  #game-wrapper {
    position: relative;
    width: min(480px, 100vw - 20px);
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: #ffffff;
    border-radius: 16px 16px 0 0;
    border: 3px solid #c5d3f7;
    border-bottom: none;
  }

  #word-display {
    font-size: 48px;
    font-weight: 900;
    color: #2d3436;
    letter-spacing: 12px;
    text-shadow: none;
  }

  #stars {
    display: flex;
    gap: 6px;
  }

  .star {
    font-size: 32px;
    transition: all 0.3s;
  }

  .star.earned {
    filter: drop-shadow(0 0 6px gold);
  }

  .star.lost {
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-10deg); }
    75% { transform: translateX(4px) rotate(10deg); }
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border: 3px solid #c5d3f7;
    border-top: none;
    border-radius: 0 0 16px 16px;
    background: #4a7c59;
  }

  #start-screen, #end-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(240, 244, 255, 0.97);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 16px;
    z-index: 10;
  }

  #start-screen h1, #end-screen h1 {
    font-size: 42px;
    color: #ff6b8a;
    margin-bottom: 16px;
    text-align: center;
  }

  #start-screen p, #end-screen p {
    font-size: 22px;
    color: #2d3436;
    margin-bottom: 30px;
    text-align: center;
    line-height: 1.5;
  }

  #end-screen .final-stars {
    font-size: 48px;
    margin-bottom: 20px;
  }

  .btn {
    font-size: 28px;
    padding: 14px 48px;
    border: none;
    border-radius: 50px;
    background: #ff6b8a;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }

  .btn:hover { background: #e8527a; transform: scale(1.05); }

  #mobile-controls {
    display: none;
    justify-content: center;
    gap: 24px;
    margin-top: 12px;
  }

  .mobile-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid #c5d3f7;
    background: #ffffff;
    color: #2d3436;
    font-size: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .mobile-btn:active { background: #c5d3f7; }

  @media (pointer: coarse) {
    #mobile-controls { display: flex; }
  }

  @media (max-width: 500px) {
    #word-display { font-size: 32px; letter-spacing: 8px; }
    .star { font-size: 24px; }
    .mobile-btn { width: 60px; height: 60px; font-size: 28px; }
  }

  .feedback {
    position: absolute;
    font-size: 64px;
    z-index: 5;
    animation: floatUp 1s forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <div id="word-display">CAT</div>
    <div id="stars"></div>
  </div>
  <canvas id="game" width="480" height="640"></canvas>

  <div id="start-screen">
    <h1>🚗 Word Drive!</h1>
    <p>Read the word at the top.<br>Drive into the matching picture!<br>⬅️ ➡️ Arrow keys to move.</p>
    <button class="btn" id="start-btn">GO!</button>
  </div>

  <div id="end-screen" style="display:none;">
    <h1>Great Job!</h1>
    <div class="final-stars" id="final-stars"></div>
    <p id="end-message"></p>
    <button class="btn" id="restart-btn">Play Again!</button>
    <a href="index.html" class="btn" style="background:none;border:2px solid #ff6b8a;color:#ff6b8a;margin-top:8px;text-decoration:none;display:inline-block;text-align:center;">Home</a>
  </div>

  <div id="mobile-controls">
    <button class="mobile-btn" id="left-btn">⬅️</button>
    <button class="mobile-btn" id="right-btn">➡️</button>
  </div>
</div>

<script src="shared/data.js"></script>
<script src="shared/game.js"></script>
<script>
// ── CVC Words & Emoji Mappings ──
const CVC_WORDS = GameData.getReadingWords(KidsGame.getWordLength());

const WORDS_PER_SESSION = 5;
const LANE_COUNT = 4;

// ── Canvas Setup ──
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const LANE_W = W / LANE_COUNT;

// ── Game State ──
let gameRunning = false;
const driveVehicle = KidsGame.getDriveVehicle();
const drivingSound = KidsGame.createDrivingSoundPlayer(
  driveVehicle === "bike"
    ? { src: "audio/bike-drive.mp3", loopStart: 7, rate: 1.1 }
    : { src: "audio/car-drive.mp3", loopStart: 18, rate: 1.15 }
);
let car = { lane: 1, width: 50, height: 70 };
let objects = [];
let currentRound = 0;
let starsEarned = 0;
let sessionWords = [];
let currentWord = null;
let spawnReady = false;
let objectSpeed = 1.5;
const ROAD_SCROLL_SPEED = objectSpeed * 3;
const EDGE_SCROLL_SPEED = objectSpeed * 4;
let roadLineOffset = 0;
let edgeLineOffset = 0;
let exhaustParticles = [];
let feedbacks = [];
let roundActive = false;
let roundCooldown = 0;
let firstCorrectHit = true;

// ── DOM Elements ──
const wordDisplay = document.getElementById("word-display");
const starsEl = document.getElementById("stars");
const startScreen = document.getElementById("start-screen");
const endScreen = document.getElementById("end-screen");
const wrapper = document.getElementById("game-wrapper");

// ── Stars Rendering ──
function renderStars() {
  KidsGame.renderStars(starsEl, starsEarned, WORDS_PER_SESSION);
}

// ── Pick Session Words ──
function pickSessionWords() {
  return KidsGame.pickRandom(CVC_WORDS, WORDS_PER_SESSION);
}

// ── Spawn Objects for Current Word ──
function spawnObjects() {
  objects = [];
  if (!currentWord) return;

  const lanes = KidsGame.shuffle([0, 1, 2, 3]);
  const correctLane = lanes[0];

  // Place correct emoji — stagger vertically so they don't all appear at once
  objects.push({
    emoji: currentWord.emoji,
    lane: correctLane,
    y: -80 - (0 * 160),
    correct: true,
    hit: false,
    size: 50,
  });

  // Place distractors — random emojis from the same word pool, not a fixed list
  const distractors = KidsGame.pickDistractors(CVC_WORDS, currentWord, 3, {
    getKey: w => w.emoji,
  });
  for (let i = 0; i < 3; i++) {
    objects.push({
      emoji: distractors[i].emoji,
      lane: lanes[i + 1],
      y: -80 - ((i + 1) * 160),
      correct: false,
      hit: false,
      size: 50,
    });
  }

  // Shuffle so correct isn't always first in the array
  objects = KidsGame.shuffle(objects);
  firstCorrectHit = true;
  roundActive = true;
}

// ── Car Drawing ──
function drawCar() {
  const x = car.lane * LANE_W + LANE_W / 2;
  const y = H - 100;

  if (roundActive) {
    exhaustParticles.push({
      x: x + (Math.random() - 0.5) * 16,
      y: y + car.height / 2,
      size: 8 + Math.random() * 4,
      life: 1,
    });
  }

  KidsGame.drawTopDownVehicle(ctx, x, y, car.width, car.height, driveVehicle);
}

// ── Exhaust Particle Trail ──
function drawExhaustParticles() {
  for (let i = exhaustParticles.length - 1; i >= 0; i--) {
    const p = exhaustParticles[i];
    p.y += ROAD_SCROLL_SPEED;
    p.life -= 0.05;
    if (p.life <= 0) {
      exhaustParticles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = `rgba(230, 230, 230, ${p.life * 0.5})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Road Drawing ──
function drawRoad() {
  // Road surface
  ctx.fillStyle = "#555";
  ctx.fillRect(0, 0, W, H);

  // Lane dividers (dashed) — scroll faster than objects for a sense of speed
  roadLineOffset = (roadLineOffset + ROAD_SCROLL_SPEED) % 40;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 20]);
  for (let i = 1; i < LANE_COUNT; i++) {
    ctx.beginPath();
    ctx.lineDashOffset = -roadLineOffset;
    ctx.moveTo(i * LANE_W, 0);
    ctx.lineTo(i * LANE_W, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Road edges with fast-scrolling motion ticks
  edgeLineOffset = (edgeLineOffset + EDGE_SCROLL_SPEED) % 30;
  ctx.fillStyle = "#ff6b8a";
  ctx.fillRect(0, 0, 6, H);
  ctx.fillRect(W - 6, 0, 6, H);
  ctx.fillStyle = "#fff2f5";
  for (let y = -30 + edgeLineOffset; y < H; y += 30) {
    ctx.fillRect(0, y, 6, 14);
    ctx.fillRect(W - 6, y, 6, 14);
  }
}

// ── Object Drawing ──
function drawObjects() {
  for (const obj of objects) {
    if (obj.hit) continue;
    const x = obj.lane * LANE_W + LANE_W / 2;
    ctx.font = `${obj.size}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#000";
    ctx.fillText(obj.emoji, x, obj.y);
  }
}

// ── Collision Detection ──
function checkCollisions() {
  const carX = car.lane * LANE_W + LANE_W / 2;
  const carY = H - 100;

  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    if (obj.hit) continue;
    const objX = obj.lane * LANE_W + LANE_W / 2;

    const dx = Math.abs(carX - objX);
    const dy = Math.abs(carY - obj.y);

    if (dx < 45 && dy < 45) {
      if (obj.correct) {
        // Correct — earn star only on first correct hit
        if (firstCorrectHit) {
          starsEarned = Math.min(WORDS_PER_SESSION, starsEarned + 1);
        }
        KidsGame.showCanvasFeedback("⭐", carX, carY - 60, canvas, wrapper, { className: "feedback", offsetY: 60 });
        KidsGame.playTone(true);
        renderStars();
        objects = [];
        roundActive = false;
        roundCooldown = 60;
        return;
      } else {
        // Wrong — just disappear, round continues
        obj.hit = true;
        firstCorrectHit = false;
        KidsGame.showCanvasFeedback("❌", objX, obj.y - 40, canvas, wrapper, { className: "feedback", offsetY: 60 });
        KidsGame.playTone(false);
      }
    }
  }
}

// ── Next Round ──
function nextRound() {
  currentRound++;
  if (currentRound > WORDS_PER_SESSION) {
    endGame();
    return;
  }
  currentWord = sessionWords[currentRound - 1];
  wordDisplay.textContent = currentWord.word;
  spawnObjects();
}

// ── End Game ──
function endGame() {
  gameRunning = false;
  drivingSound.stop();
  KidsGame.showEndScreen({
    screenEl: endScreen,
    messageEl: document.getElementById("end-message"),
    finalStarsEl: document.getElementById("final-stars"),
    earned: starsEarned,
    total: WORDS_PER_SESSION,
    reward: { enabled: false },
    messages: {
      perfect: { message: "Perfect! You got all the stars!" },
      good: { message: "Great driving! Keep it up!" },
      try: { message: "Good try! Play again to get more stars!" },
    },
  });
}

// ── Main Game Loop ──
function gameLoop() {
  if (!gameRunning) return;

  drawRoad();
  drawExhaustParticles();
  drawCar();

  if (roundActive) {
    // Move objects down
    for (const obj of objects) {
      if (!obj.hit) obj.y += objectSpeed;
    }

    // Loop objects back to top when they pass the bottom
    for (const obj of objects) {
      if (!obj.hit && obj.y > H + 50) {
        // Find the highest (most negative / closest to top) visible object
        let minY = 0;
        for (const o of objects) {
          if (!o.hit && o.y < minY) minY = o.y;
        }
        obj.y = minY - 160;
        // Randomize lane on respawn
        const usedLanes = objects.filter(o => o !== obj && !o.hit && Math.abs(o.y - obj.y) < 100).map(o => o.lane);
        let newLane;
        do { newLane = Math.floor(Math.random() * LANE_COUNT); } while (usedLanes.includes(newLane));
        obj.lane = newLane;
      }
    }

    drawObjects();
    checkCollisions();
  } else {
    if (roundCooldown > 0) {
      roundCooldown--;
    } else {
      nextRound();
    }
  }

  requestAnimationFrame(gameLoop);
}

// ── Input Handling ──
function moveCar(direction) {
  if (!gameRunning) return;
  if (direction === "left" && car.lane > 0) car.lane--;
  if (direction === "right" && car.lane < LANE_COUNT - 1) car.lane++;
}

function moveCarToLane(lane) {
  if (!gameRunning) return;
  if (lane >= 0 && lane < LANE_COUNT) car.lane = lane;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); moveCar("left"); }
  if (e.key === "ArrowRight") { e.preventDefault(); moveCar("right"); }
});

// Tap on canvas to move car to that lane
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  moveCarToLane(Math.floor(x / LANE_W));
});

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = (touch.clientX - rect.left) * (W / rect.width);
  moveCarToLane(Math.floor(x / LANE_W));
});

// Mobile arrow controls (kept as fallback)
document.getElementById("left-btn").addEventListener("touchstart", (e) => { e.preventDefault(); moveCar("left"); });
document.getElementById("right-btn").addEventListener("touchstart", (e) => { e.preventDefault(); moveCar("right"); });
document.getElementById("left-btn").addEventListener("click", () => moveCar("left"));
document.getElementById("right-btn").addEventListener("click", () => moveCar("right"));

// ── Start / Restart ──
function startGame() {
  startScreen.style.display = "none";
  endScreen.style.display = "none";
  starsEarned = 0;
  currentRound = 0;
  objects = [];
  exhaustParticles = [];
  roundActive = false;
  roundCooldown = 30;
  car.lane = 1;
  sessionWords = pickSessionWords();
  renderStars();
  gameRunning = true;
  drivingSound.start();
  gameLoop();
}

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("restart-btn").addEventListener("click", startGame);

// Initial stars
renderStars();
</script>

</body>
</html>
