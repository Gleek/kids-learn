<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Puzzles · Kids Learn</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="shared/puzzles.css">
  <script src="shared/voice-clips.js" defer></script>
  <script src="shared/game.js" defer></script>
  <script src="shared/builder.js" defer></script>
  <script src="shared/puzzle-data.js" defer></script>
  <script src="shared/puzzle-visuals.js" defer></script>
  <script src="shared/puzzle-play.js" defer></script>
</head>
<body class="puzzle-page">
  <main id="game-wrapper">
    <header class="game-topbar">
      <a href="index.html#picture-puzzles" class="game-back">← Games</a>
      <h1 id="puzzle-title">Picture Puzzles</h1>
      <div id="stars" aria-label="Round progress"></div>
    </header>

    <section id="puzzle-stage" class="puzzle-stage">
      <div id="start-screen" class="puzzle-overlay">
        <div id="start-mark" class="start-mark" aria-hidden="true"></div>
        <p id="puzzle-description"></p>
        <button id="start-btn" class="puzzle-action" type="button">Play</button>
      </div>

      <div id="puzzle-round" hidden>
        <div class="puzzle-prompt">
          <h2 id="puzzle-question" tabindex="-1"></h2>
          <button id="listen-btn" class="listen-btn" type="button" aria-label="Read the prompt aloud" title="Read the prompt aloud">🔊</button>
        </div>
        <div id="scene" class="puzzle-scene"></div>
        <div id="choices" class="puzzle-choices" role="group" aria-label="Choices"></div>
        <button id="ready-btn" class="puzzle-action" type="button" hidden>I’m ready</button>
        <p id="puzzle-feedback" class="puzzle-feedback" role="status"></p>
      </div>

      <div id="end-screen" class="puzzle-overlay" style="display:none">
        <h2 id="end-title" tabindex="-1"></h2>
        <div id="final-stars" class="final-stars"></div>
        <p id="end-message"></p>
        <button id="restart-btn" class="puzzle-action" type="button">Play Again</button>
        <a href="index.html#picture-puzzles">All games</a>
      </div>

      <div id="puzzle-progress" class="puzzle-progress" hidden>
        <span id="round-label"></span>
        <div id="vehicle-area"></div>
      </div>
    </section>
    <div id="reward-overlay"></div>
    <div id="reward-emoji">🎁</div>
  </main>
</body>
</html>
