<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Learn — Games</title>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/puzzles.css">
<script src="shared/game-catalog.js" defer></script>
<script src="shared/puzzle-data.js" defer></script>
<script src="shared/puzzle-visuals.js" defer></script>
<script src="shared/puzzle-shelf.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f2f8;
    min-height: 100vh;
    font-family: var(--puzzle-font);
    color: var(--ink);
    padding: clamp(16px, 4vw, 48px) clamp(12px, 4vw, 32px) 60px;
  }

  .home-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 18px;
    max-width: 1080px;
    margin: 0 auto 31px;
    padding: clamp(18px, 5vw, 40px);
    border-radius: 28px;
    color: #fffdf8;
    background: #272946;
  }

  .home-header h1 {
    font-size: clamp(2.35rem, 8vw, 4rem);
    line-height: 1;
    letter-spacing: -0.055em;
    margin-bottom: 9px;
  }

  .home-header p { color: #ede9f8; font-size: 1rem; }

  .settings-link {
    display: inline-block;
    padding: 10px 15px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    text-decoration: none;
    font-weight: 800;
  }

  .settings-link:hover { background: #edf0ff; }

  .categories { max-width: 1080px; margin: 0 auto; }

</style>
</head>
<body>

<header class="home-header">
  <div>
    <h1>Kids Learn</h1>
    <p>Games for ages 3–5</p>
  </div>
  <a class="settings-link" href="settings.html">⚙️ Settings</a>
</header>

<main id="more-games" class="categories">
  <section id="picture-puzzles" class="puzzle-shelf" aria-labelledby="shelf-title" hidden>
    <div class="shelf-header">
      <h2 id="shelf-title">Pick a game</h2>
    </div>
    <div id="puzzle-filters" class="shelf-filters" role="group" aria-label="Game categories"></div>
    <div id="puzzle-shelf" class="shelf-grid"></div>
  </section>
</main>

</body>
</html>
